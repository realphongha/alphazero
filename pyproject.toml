[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphazero"
version = "0.1.0"
description = "A compact, optimized AlphaZero library for MNK games (tic-tac-toe, 9x9 / 15x15 Gomoku)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "alphazero" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
gui = ["pygame>=2.1", "matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[project.scripts]
alphazero = "alphazero.cli:main"

[tool.setuptools]
packages = [
    "alphazero",
    "alphazero.games",
    "alphazero.models",
    "alphazero.training",
    "alphazero.gui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
