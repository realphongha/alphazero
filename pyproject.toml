[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphazero"
version = "0.1.0"
description = "A compact, optimized AlphaZero library for MNK games (tic-tac-toe, 9x9 / 15x15 Gomoku)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "alphazero" }]
# Core runtime dependencies -- installed by `uv sync` (and `pip install -e .`).
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "matplotlib>=3.5",   # latency/loss plots
]

# Optional feature extras -- opt in with:  uv sync --extra <name>
[project.optional-dependencies]
gui   = ["pygame>=2.1"]          # `alphazero gui`
wandb = ["wandb>=0.16"]          # `--wandb` experiment logging
all   = ["pygame>=2.1", "wandb>=0.16"]

# Development tooling (test runner). uv installs this group by default
# via `uv sync`; disable with `uv sync --no-dev`.
[dependency-groups]
dev = ["pytest>=7.0"]

[project.scripts]
alphazero = "alphazero.cli:main"

[tool.setuptools]
packages = [
    "alphazero",
    "alphazero.games",
    "alphazero.models",
    "alphazero.training",
    "alphazero.gui",
]

# uv: this is an installable package, not just an application.
[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
